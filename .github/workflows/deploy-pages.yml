name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh published data from seed
        run: node scripts/refresh-seed.mjs

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /MountHunt/

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$code" = "404" ]; then
            {
              echo '::error title=GitHub Pages not enabled::Pages site is missing (API 404). Enable it before deploy-pages can create a deployment.'
              echo ''
              echo '=== What to click (repo owner) ==='
              echo "1. Open https://github.com/${{ github.repository }}/settings/pages"
              echo '2. Under "Build and deployment" → Source, choose "GitHub Actions" (not "Deploy from a branch").'
              echo '3. Save / leave the page — GitHub creates the Pages site + github-pages environment.'
              echo '4. Re-run this workflow: Actions → Deploy to GitHub Pages → Run workflow (or push to main).'
              echo ''
              echo 'Repo is public; GitHub Pro is NOT required. Private repos need Pro (or public) for Pages.'
              echo "Settings: https://github.com/${{ github.repository }}/settings/pages"
            } >&2
            exit 1
          fi

          if [ "$code" != "200" ]; then
            echo "::error::Unexpected Pages API status ${code}"
            cat /tmp/pages.json >&2 || true
            exit 1
          fi

          build_type=$(python3 -c 'import json; print(json.load(open("/tmp/pages.json")).get("build_type") or "")')
          if [ "$build_type" != "workflow" ]; then
            {
              echo "::error title=Wrong Pages source::Pages build_type is '${build_type:-unset}', expected 'workflow' (GitHub Actions)."
              echo "Open https://github.com/${{ github.repository }}/settings/pages"
              echo 'Set Source to "GitHub Actions", then re-run this workflow.'
            } >&2
            exit 1
          fi

          echo "Pages OK (build_type=workflow)."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
