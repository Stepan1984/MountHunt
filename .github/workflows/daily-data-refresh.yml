# Ежедневный сбор цен/часов (волны 1–3) → public/data → commit.
# Cron: 05:00 UTC ≈ 08:00 Europe/Moscow.
name: Daily data refresh

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install OCR tools (Yukki PDF scan fallback)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium (Igora SPA / flaky HTML)
        run: npx playwright install --with-deps chromium

      - name: Scrape waves 1–3 → public/data
        run: npm run scrape
        env:
          SCRAPE_DELAY_MS: '1500'
          # Live Playwright first; bundled data/snapshots/igora only if live load fails.
          IGORA_TIMEOUT_MS: '120000'

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/seed/resorts.json
          if git diff --staged --quiet; then
            echo "Нет изменений данных"
          else
            git commit -m "chore(data): ежедневный scrape waves 1–3"
            git push
          fi
