# Ежедневное обновление данных (пока заглушка).
# Cron: 05:00 UTC ≈ 08:00 Europe/Moscow.
# Позже: scrape → normalize → запись JSON; сейчас только refresh seed в public/data.
name: Daily data refresh

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh seed JSON into public/data
        run: node scripts/refresh-seed.mjs

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Нет изменений данных"
          else
            git commit -m "chore(data): ежедневное обновление seed/meta"
            git push
          fi
