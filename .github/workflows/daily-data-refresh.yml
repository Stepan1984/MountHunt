# Ежедневный сбор цен/часов (волны 1–3) → public/data → commit.
# Cron: 05:00 UTC ≈ 08:00 Europe/Moscow.
name: Daily data refresh

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Yukki PDF is often a scan — need OCR. Gate apt behind a cheap binary probe
      # so reruns on self-hosted/custom images with tools already present skip apt.
      - name: Install OCR tools (Yukki PDF scan fallback)
        run: |
          if command -v pdftotext >/dev/null && command -v pdftoppm >/dev/null && command -v tesseract >/dev/null; then
            echo "OCR tools already present — skip apt"
            tesseract --list-langs 2>/dev/null | grep -qi rus || {
              echo "rus langpack missing — installing OCR apt packages"
              sudo apt-get update -qq
              sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus
            }
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus
          fi

      # Cache Chromium download (~100MB). OS deps still need install-deps each job
      # on ubuntu-latest; browser bytes are the expensive repeat download.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (Igora SPA)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright browser cache hit — install OS deps only, then verify chromium"
            npx playwright install-deps chromium
            npx playwright install chromium
          else
            echo "Playwright cache miss — full install --with-deps"
            npx playwright install --with-deps chromium
          fi

      - name: Scrape waves 1–3 → public/data
        run: npm run scrape
        env:
          SCRAPE_DELAY_MS: '1500'
          # Live Playwright only. Do NOT set IGORA_HTML_DIR / IGORA_ALLOW_SNAPSHOT /
          # SCRAPE_HTML_DIR — scraper also refuses snapshots when CI/GITHUB_ACTIONS is set.
          IGORA_TIMEOUT_MS: '120000'

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/seed/resorts.json
          if git diff --staged --quiet; then
            echo "Нет изменений данных"
          else
            git commit -m "chore(data): ежедневный scrape waves 1–3"
            git push
          fi
